[package]
name = "dettato-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Native Rust and Burn implementation of the Dettato multi-instrument transcription pipeline"

[features]
default = ["flex", "extended-audio"]
extended-audio = ["symphonia/mp3", "symphonia/aac", "symphonia/isomp4", "symphonia/alac"]
flex = ["burn/flex"]
cuda = ["burn/cuda", "burn/fusion", "burn/autotune"]
cpu = ["burn/cpu", "burn/fusion", "burn/autotune"]
wgpu = ["burn/wgpu", "burn/fusion", "burn/autotune"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "cubecl"] }
rustfft = "=6.4.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "ogg", "vorbis", "aiff"] }
safetensors = "=0.8.0"
half = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
