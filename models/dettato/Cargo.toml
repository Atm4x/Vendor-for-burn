[package]
name = "dettato-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Native Rust and Burn implementation of the Dettato multi-instrument transcription pipeline"

[features]
default = ["flex"]
flex = ["burn/flex"]
cuda = ["burn/cuda"]
cpu = ["burn/cpu"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "cubecl"] }
rustfft = "=6.4.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4", "aiff", "alac"] }
safetensors = "=0.8.0"
half = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
