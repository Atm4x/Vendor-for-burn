[package]
name = "gigaam-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[features]
default = ["flex"]
cpu = ["burn/cpu"]
flex = ["burn/flex"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std"] }
burn-store = { version = "=0.22.1", default-features = false, features = ["std", "pytorch"] }
burn-pack = "=0.22.1"
safetensors = "0.8"
half = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hound = "3.5"
rustfft = "6.4.1"
