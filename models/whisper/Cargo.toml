[package]
name = "whisper-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex", "cuda", "wgpu"] }
native-worker-ipc = { path = "../../crates/native-worker-ipc" }
native-worker-audio = { path = "../../crates/native-worker-audio" }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[workspace]
