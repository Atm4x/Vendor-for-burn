[package]
name = "fish-speech-vendor"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cuda-driver = ["dep:cudarc"]
tensorrt-mock = ["dep:trtx", "dep:trtx-sys", "trtx/mock"]
tensorrt-api = ["dep:trtx", "dep:trtx-sys"]
cubecl-backend = ["dep:cubecl"]
cubecl-cpu = ["cubecl-backend", "cubecl/cpu"]
cubecl-cuda = ["cubecl-backend", "cubecl/cuda"]
worker = ["cubecl-cuda", "cubecl/wgpu", "dep:native-worker-ipc"]

[[bin]]
name = "fish-speech-worker"
path = "src/bin/fish-speech-worker.rs"
required-features = ["worker"]

[dependencies]
cubecl = { version = "=0.11.3", optional = true, default-features = false, features = ["std"] }
fish-speech-core-prototype = { path = "core" }
bytemuck = "1.25"
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12090"] }
base64 = "0.22"
half = { version = "2.7", features = ["bytemuck"] }
hound = "3.5"
rand_chacha = "0.9"
rustfft = "6"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = "0.6"
thiserror = "2"
tiktoken-rs = "0.12.1"
trtx = { version = "=0.9.1", default-features = false, features = ["v_1_7", "dlopen_tensorrt_rtx"], optional = true }
trtx-sys = { version = "=0.9.1", default-features = false, features = ["v_1_7"], optional = true }
native-worker-ipc = { path = "../../crates/native-worker-ipc", optional = true }

[workspace]
