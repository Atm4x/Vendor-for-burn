[package]
name = "silero-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[features]
default = ["cubecl-cpu"]
cubecl-cpu = ["burn/cpu", "burn/cubecl"]
cubecl-cuda = ["burn/cuda", "burn/cubecl"]
cubecl-wgpu = ["burn/wgpu", "burn/cubecl"]
reference-flex = ["burn/flex", "dep:burn-flex", "dep:rustfft"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std"] }
burn-flex = { version = "=0.22.1", default-features = false, features = ["std", "simd", "rayon"], optional = true }
safetensors = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
xml = { package = "xml-rs", version = "=0.8.29" }
hound = "=3.5.1"
base64 = "=0.22.1"
rustfft = { version = "=6.4.1", optional = true }

[dev-dependencies]
