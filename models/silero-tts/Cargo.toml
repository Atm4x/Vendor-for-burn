[package]
name = "silero-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[features]
default = ["cubecl-cpu"]
cubecl-cpu = ["burn/cpu"]
cubecl-cuda = ["burn/cuda"]
cubecl-wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "cubecl"] }
safetensors = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"

[dev-dependencies]
