[package]
name = "silero-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[features]
default = ["cubecl-cpu"]
cubecl-cpu = ["burn/cpu", "burn/cubecl"]
cubecl-cuda = ["burn/cuda", "burn/cubecl", "gpu-device-resolver/cuda"]
cubecl-wgpu = ["burn/wgpu", "burn/cubecl", "gpu-device-resolver/wgpu"]
reference-flex = ["burn/flex", "dep:burn-flex", "dep:rustfft", "dep:rayon", "dep:gemm", "gemm/x86-v4"]
ruaccent = ["dep:ruaccent_rs", "ruaccent_rs/onnx"]

[dependencies]
native-worker-ipc = { path = "../../crates/native-worker-ipc" }
gpu-device-resolver = { path = "../../crates/gpu-device-resolver", default-features = false, optional = true }
silero-package = { path = "native-import" }
burn = { version = "=0.22.1", default-features = false, features = ["std"] }
burn-flex = { version = "=0.22.1", default-features = false, features = ["std", "simd", "rayon"], optional = true }
safetensors = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
regex = "1"
xml = { package = "xml-rs", version = "=0.8.29" }
hound = "=3.5.1"
base64 = "=0.22.1"
rustfft = { version = "=6.4.1", optional = true }
rayon = { version = "=1.12.0", optional = true }
gemm = { version = "=0.19.0", default-features = false, features = ["std", "rayon"], optional = true }

ruaccent_rs = { package = "ruaccent_rs", path = "../ruaccent", default-features = false, optional = true }

[dev-dependencies]

[workspace]
exclude = ["native-import"]
