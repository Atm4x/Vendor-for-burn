[package]
name = "f5-tts-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Model-specific F5-TTS v1 inference runtime with independent CubeCL and TensorRT-RTX backends"

[lib]
name = "f5_tts_native"
path = "src/lib.rs"

[features]
default = []
cubecl-cpu = ["dep:burn", "burn/cpu"]
cubecl-cuda = ["dep:burn", "burn/cuda"]
cubecl-wgpu = ["dep:burn", "burn/wgpu"]
tensorrt-api = ["dep:trtx"]
tensorrt-mock = ["tensorrt-api", "trtx/mock"]

[dependencies]
serde_json = "1"
jieba-rs = "=0.11.0"
trtx = { version = "=0.9.1", default-features = false, features = ["v_1_7", "dlopen_tensorrt_rtx"], optional = true }
burn = { version = "=0.22.1", default-features = false, features = ["std", "cubecl"], optional = true }
