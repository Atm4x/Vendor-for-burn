[package]
name = "f5-tts-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Model-specific F5-TTS v1 inference runtime with independent CubeCL and TensorRT-RTX backends"

[lib]
name = "f5_tts_native"
path = "src/lib.rs"

[features]
default = []
cubecl-cpu = ["dep:burn", "burn/cpu"]
cubecl-cuda = ["dep:burn", "burn/cuda"]
cubecl-cuda-fp16 = ["cubecl-cuda", "burn/autotune", "burn/fusion"]
cubecl-wgpu = ["dep:burn", "burn/wgpu"]
tensorrt-api = ["dep:trtx", "dep:libloading"]
tensorrt-mock = ["tensorrt-api", "trtx/mock"]
worker = ["cubecl-cuda-fp16", "cubecl-wgpu", "dep:native-worker-ipc", "dep:hound", "dep:serde", "dep:gpu-device-resolver"]

[[bin]]
name = "f5-tts-worker"
path = "src/bin/f5-tts-worker.rs"
required-features = ["worker"]

[dependencies]
serde_json = "1"
libloading = { version = "=0.8.9", optional = true }
jieba-rs = "=0.11.0"
trtx = { version = "=0.9.1", default-features = false, features = ["v_1_7", "dlopen_tensorrt_rtx"], optional = true }
burn = { version = "=0.22.1", default-features = false, features = ["std", "cubecl"], optional = true }
native-worker-ipc = { path = "../../crates/native-worker-ipc", optional = true }
gpu-device-resolver = { path = "../../crates/gpu-device-resolver", default-features = false, features = ["cuda", "wgpu"], optional = true }
hound = { version = "3.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[workspace]
