name: RVC Stage127 ImplicitGemm Async and full90 Nsight RTX package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rvc-stage127-implicit-async-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: rvc-stage127-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rvc-stage126-
            rvc-stage125-
      - name: Validate Stage127 Python, PowerShell and mode contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'research/stage127-implicit-async/windows'
          $ps1 = Join-Path $root 'Run-Stage127-Full90-Profile.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $ps1).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Host; throw 'Stage127 PowerShell syntax error' }
          python -m compileall -q $root
          if ($LASTEXITCODE -ne 0) { throw 'Stage127 Python compile failed' }
          python -m unittest discover -s $root -p 'test_stage127_contract.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Stage127 route contract failed' }
      - name: Restore vendored crate checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendor source integrity validation failed' }
      - name: Compile Stage127 Rust CUDA CPU WGPU release
        shell: pwsh
        run: |
          cargo build --release --locked --offline -p tts-with-rvc-rs --no-default-features --features 'cpu,cuda,wgpu' --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'Stage127 release build failed' }
          & target/release/tts-with-rvc-rs.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Stage127 doctor failed' }
      - name: Publish one self-contained Stage127 Windows artifact
        shell: pwsh
        run: |
          $out = 'dist/rvc-stage127-implicit-async-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/tts-with-rvc-rs.exe $out
          Copy-Item research/stage127-implicit-async/windows/*.py $out
          Copy-Item research/stage127-implicit-async/windows/Run-Stage127-Full90-Profile.ps1 $out
          Copy-Item research/stage127-implicit-async/README.md $out
          Copy-Item research/stage127-implicit-async/REPORT.md (Join-Path $out 'STAGE127_REPORT.md')
          Copy-Item research/stage127-implicit-async/WORKFLOW_CONTRACT.md (Join-Path $out 'RVC_RND_WORKFLOW_CONTRACT.md')
          Set-Content -LiteralPath (Join-Path $out 'BUILD_STATUS.txt') -Encoding utf8 -Value "Stage127 Windows Rust build PASS; commit=$env:GITHUB_SHA; RTX4060 CUDA JIT, quality and performance GPU UNVERIFIED"
      - uses: actions/upload-artifact@v4
        with:
          name: rvc-stage127-implicit-async-windows-x64
          path: dist/rvc-stage127-implicit-async-windows-x64/
          if-no-files-found: error
          retention-days: 14
