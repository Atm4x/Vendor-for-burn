name: F5 TTS Git Bridge Export
on:
  push:
    branches:
      - codex/f5-tts-bridge-bootstrap-20261120
    paths:
      - .github/workflows/f5-tts-bridge-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: 12ef7d2dbe8b62d3a3a530bf9f4ed9611e45fc00
          fetch-depth: 0
          persist-credentials: false
      - name: Create verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=12ef7d2dbe8b62d3a3a530bf9f4ed9611e45fc00
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git update-ref refs/heads/codex/fish-speech-cont48-tensorrt "$SOURCE"
          git bundle create "${RUNNER_TEMP}/repository.bundle" refs/heads/codex/fish-speech-cont48-tensorrt
          git bundle verify "${RUNNER_TEMP}/repository.bundle"
          git bundle list-heads "${RUNNER_TEMP}/repository.bundle"
          (
            cd "${RUNNER_TEMP}"
            sha256sum repository.bundle > repository.bundle.sha256
            printf '%s\n' "$SOURCE" > source-head.txt
          )
      - name: Upload F5 Git Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: f5-tts-source-cont48-git-bridge
          path: |
            ${{ runner.temp }}/repository.bundle
            ${{ runner.temp }}/repository.bundle.sha256
            ${{ runner.temp }}/source-head.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
