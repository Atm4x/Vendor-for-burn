name: Release Beat This worker for Windows

on:
  push:
    tags:
      - 'beat-this-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version already committed to models/beat_this/Cargo.toml
        required: true
        type: string

concurrency:
  group: native-worker-releases
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/beat-this-v')
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve the explicitly published version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.Substring('beat-this-v'.Length)
          } else { $env:MANUAL_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          "WORKER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and verify the worker
        shell: pwsh
        run: |
          ./models/beat_this/package_windows.ps1 -Version $env:WORKER_VERSION -OutputRoot (Join-Path $env:RUNNER_TEMP 'beat-this-release')
      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:WORKER_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          $releaseAssets = @(Get-ChildItem -File (Join-Path $env:RUNNER_TEMP 'beat-this-release/assets'))
          $tag = 'native-workers-v1.0.0'
          $existing = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($releaseAssets.Name | Where-Object { $_ -in $existing }) {
            throw 'This package version already has release assets. Bump the model version.'
          }
          gh release upload $tag @($releaseAssets.FullName) --repo $env:GITHUB_REPOSITORY
