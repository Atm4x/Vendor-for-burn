name: RVC Stage60 RMVPE warp-per-frame plane readback Windows CUDA

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
    paths:
      - 'models/tts-with-rvc-rs/src/rmvpe_fused.rs'
      - 'models/tts-with-rvc-rs/src/lib.rs'
      - 'models/tts-with-rvc-rs/src/rmvpe.rs'
      - 'models/tts-with-rvc-rs/src/rmvpe_mel.rs'
      - 'models/tts-with-rvc-rs/src/rvc_inference.rs'
      - 'research/stage37-windows-gpu-bench/windows/Run-RVC-RMVPE-Plane-Stage60.ps1'
      - '.github/workflows/rvc-rmvpe-plane-stage60.yml'

permissions:
  contents: read

jobs:
  native-stage60:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: rvc-stage60-${{ hashFiles('Cargo.lock') }}
      - name: Restore vendored checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendored checksum restore failed' }
      - name: Validate PowerShell runner syntax before packaging
        shell: pwsh
        run: |
          $runner = 'research/stage37-windows-gpu-bench/windows/Run-RVC-RMVPE-Plane-Stage60.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $runner).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "Stage60 runner parse errors: $($parseErrors.Count)"
          }
      - name: Build native RVC CUDA executable
        shell: pwsh
        run: |
          cargo build --release --locked --offline -p tts-with-rvc-rs --features cuda --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'RVC CUDA compilation failed' }
          cargo test --locked --offline -p tts-with-rvc-rs --features cuda --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'RVC CLI tests failed' }
      - name: Stage60 smoke and package
        shell: pwsh
        run: |
          $exe = 'target/release/tts-with-rvc-rs.exe'
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'RVC help failed' }
          New-Item -ItemType Directory -Force -Path dist/rvc-stage60 | Out-Null
          Copy-Item $exe dist/rvc-stage60/
          Copy-Item research/stage37-windows-gpu-bench/windows/Run-RVC-RMVPE-Plane-Stage60.ps1 dist/rvc-stage60/
          @'
          Stage60: experimental CUDA plane-per-frame RMVPE reduction versus Dense, Burn Compact and Sequential Fused.
          Native Rust/CUDA RVC. Use your own private model files and WAV locally.
          CUDA plane operations are not executable on the CubeCL CPU backend. Test on NVIDIA CUDA.
          This is NOT a claim of CUDA speedup; compare full WAV SHA and per-stage times.
          Runner: Run-RVC-RMVPE-Plane-Stage60.ps1 -Voice PATH -Hubert PATH -Rmvpe PATH -Index PATH -InputWav PATH -Duration 0.7 -Device cuda
          Output: RVC_STAGE60_RMVPE_PLANE_RESULTS.zip. Does not require Python.
          '@ | Set-Content dist/rvc-stage60/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-stage60-rmvpe-plane-windows-x64
          path: dist/rvc-stage60/
          retention-days: 14
          if-no-files-found: warn
