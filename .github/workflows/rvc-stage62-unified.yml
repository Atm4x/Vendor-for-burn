name: RVC Stage62 unified CPU CUDA WGPU Windows EXE
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
    paths:
      - 'models/tts-with-rvc-rs/src/faiss_gpu.rs'
      - 'models/tts-with-rvc-rs/src/rmvpe_gpu_f0.rs'
      - 'models/tts-with-rvc-rs/src/rmvpe_mel.rs'
      - 'models/tts-with-rvc-rs/src/rvc_inference.rs'
      - 'models/tts-with-rvc-rs/src/rmvpe_fused.rs'
      - 'models/tts-with-rvc-rs/src/main.rs'
      - 'models/tts-with-rvc-rs/src/lib.rs'
      - 'models/tts-with-rvc-rs/Cargo.toml'
      - 'research/stage37-windows-gpu-bench/windows/Run-RVC-Stage62-Resident.ps1'
      - '.github/workflows/rvc-stage62-unified.yml'
permissions:
  contents: read
jobs:
  unified-runtimes:
    runs-on: windows-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: stage62-unified-${{ hashFiles('Cargo.lock') }}
      - name: Restore vendored checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendored checksum restore failed' }
      - name: Parse runner before packaging
        shell: pwsh
        run: |
          $script = 'research/stage37-windows-gpu-bench/windows/Run-RVC-Stage62-Resident.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Host; throw 'Invalid Stage62 PowerShell syntax' }
      - name: Build unified CPU CUDA WGPU EXE
        shell: pwsh
        run: |
          cargo build --release --locked --offline -p tts-with-rvc-rs --no-default-features --features 'cpu,cuda,wgpu' --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'Unified native build failed' }
      - name: Verify one executable supports all three backends
        shell: pwsh
        run: |
          & target/release/tts-with-rvc-rs.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed' }
          & target/release/tts-with-rvc-rs.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed' }
      - name: Package one user-facing runner
        shell: pwsh
        run: |
          $folder = 'dist/stage62-unified'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item target/release/tts-with-rvc-rs.exe $folder
          Copy-Item research/stage37-windows-gpu-bench/windows/Run-RVC-Stage62-Resident.ps1 $folder
          @'
          Unified experimental RVC runtime, CubeCL CPU/CUDA/WGPU from the SAME EXE.
          Use -Device cuda|wgpu|cpu, no silent fallback.
          Copy private models and WAV into .\embed\ (never packaged into the artifact).
          Warm measurements repeat inference with the same loaded model in a single process.
          GPU IVF and FP32 GPU F0 remain opt-in and require actual GPU validation.
          '@ | Set-Content "$folder/README.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-stage62-unified-cpu-cuda-wgpu-windows-x64
          path: dist/stage62-unified/
          retention-days: 14
          if-no-files-found: warn
