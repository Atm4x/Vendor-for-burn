name: F5 TTS CONT21 Exact Git Bridge
on:
  push:
    branches: [codex/f5-tts-rust-cont21]
    paths: [.github/workflows/f5-tts-cont21-bridge.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify parent and export complete repo bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2d138f597ab40c582b6817cc8cec0ee39d86fd73"
          git update-ref refs/heads/codex/f5-tts-rust-cont21 HEAD
          git bundle create "$RUNNER_TEMP/f5-cont21.bundle" HEAD refs/heads/codex/f5-tts-rust-cont21
          git bundle verify "$RUNNER_TEMP/f5-cont21.bundle"
          git bundle list-heads "$RUNNER_TEMP/f5-cont21.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/source-head.txt"
          git rev-parse HEAD^ > "$RUNNER_TEMP/parent-head.txt"
          (cd "$RUNNER_TEMP" && sha256sum f5-cont21.bundle > f5-cont21.bundle.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: f5-cont21-exact-git-bridge
          path: |
            ${{ runner.temp }}/f5-cont21.bundle
            ${{ runner.temp }}/f5-cont21.bundle.sha256
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/parent-head.txt
          retention-days: 3
          compression-level: 0
