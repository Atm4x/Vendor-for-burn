name: Git Bridge - Silero existing optional dependency vendor
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: read
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Acquire only missing locked RUAccent sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, tomllib, hashlib, json, tarfile, urllib.request, os
          root=pathlib.Path("vendor")
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"silero-extra-vendor"
          out.mkdir()
          lock=tomllib.loads(pathlib.Path("models/ruaccent/Cargo.lock").read_text())
          for p in lock["package"]:
              if not p.get("source","").startswith("registry+"): continue
              n,v=p["name"],p["version"]
              name=f"{n}-{v}"
              if (root/name).is_dir(): continue
              data=urllib.request.urlopen(f"https://static.crates.io/crates/{n}/{name}.crate",timeout=45).read()
              assert hashlib.sha256(data).hexdigest()==p["checksum"],name
              import io
              with tarfile.open(fileobj=io.BytesIO(data)) as archive:
                  archive.extractall(out,filter="data")
              dst=out/name
              files={str(f.relative_to(dst)):hashlib.sha256(f.read_bytes()).hexdigest() for f in dst.rglob("*") if f.is_file() and f.name!=".cargo-checksum.json"}
              (dst/".cargo-checksum.json").write_text(json.dumps({"files":files,"package":p["checksum"]},separators=(",",":")))
              print(name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: silero-extra-vendor
          path: ${{ runner.temp }}/silero-extra-vendor/
          retention-days: 1
          compression-level: 6
