name: Git Bridge - remaining Silero checkpoint families
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [v3, v2, v5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0171c4082656af4b689ec7be5d03202afa7129f1
      - name: Acquire original packages
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, urllib.request, hashlib, json, os
          from concurrent.futures import ThreadPoolExecutor
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"models"
          out.mkdir()
          cat=json.loads(pathlib.Path("models/silero-tts/official_catalogue.json").read_text())
          choices={"v3":["v3_1_ru","ru_v3","v3_xal","v3_tt","v3_uz","v3_ua"],"v2":["aidar_v2","lj_v2","mykyta_v2","multi_v2"],"v5":["v5_caucasian","v5_cis_ext","v5_1_ru","v5_2_ru","v5_3_ru","v5_4_ru","v5_5_ru"]}[os.environ["GROUP"]]
          def get(x):
              name=x["model_id"]
              if name not in choices: return
              file=out/(name+".pt")
              try:
                  urllib.request.urlretrieve(x["url"],file)
                  print(name,file.stat().st_size,hashlib.file_digest(open(file,"rb"),"sha256").hexdigest(),flush=True)
              except Exception as e:
                  file.unlink(missing_ok=True)
                  print(name,"ERROR",str(e),flush=True)
          with ThreadPoolExecutor(max_workers=4) as p: list(p.map(get,cat["models"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: silero-cycle8-${{ matrix.group }}
          path: ${{ runner.temp }}/models/
          retention-days: 1
          compression-level: 0
