name: Git Bridge - remaining official V2 weights
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96a470e34e479dc383b6c1452d07b7063d1344af
      - name: Download exact official packages
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,pathlib,urllib.request,hashlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"models";out.mkdir()
          catalogue=json.loads(pathlib.Path("models/silero-tts/official_catalogue.json").read_text())["models"]
          wanted=[["baya_v2","irina_v2"],["kseniya_v2","natasha_v2"],["ruslan_v2","thorsten_v2"],["tux_v2","gilles_v2"],["aigul_v2","erdni_v2"],["dilyara_v2","dilnavoz_v2"]][int(os.environ["GROUP"])]
          for name in wanted:
              url=next(x["url"] for x in catalogue if x["model_id"]==name)
              path=out/(name+".pt")
              urllib.request.urlretrieve(url,path)
              print(name,path.stat().st_size,hashlib.file_digest(open(path,"rb"),"sha256").hexdigest(),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: silero-v2-pair-${{ matrix.group }}
          path: ${{ runner.temp }}/models/
          compression-level: 0
          retention-days: 1
