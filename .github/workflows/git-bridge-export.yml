name: Git Bridge - publish phase GEMM Silero candidate
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import phase GEMM commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/silero-tts-native-import
          test "$(git rev-parse origin/main)" = f3618c635442334f02c47384c01dd13fed1891f7
          test "$(git rev-parse origin/feat/silero-tts-native-import)" = 7841f8e483670f408335194901ab72e5d2c68906
          base64 -d .git-bridge/silero-6a64a705.b64 > "$RUNNER_TEMP/silero.bundle"
          echo "0d441ddb45be74b3ea614cbc30854ff530f4d3921fbcaa7a9da0030ac42a31c3  $RUNNER_TEMP/silero.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/silero.bundle"
          git fetch "$RUNNER_TEMP/silero.bundle" refs/heads/feat/silero-tts-native-import:refs/heads/silero-candidate
          test "$(git rev-parse silero-candidate)" = 6a64a705eaf739616b31dc88899ecb8e01ce5f25
          test "$(git rev-parse silero-candidate^{tree})" = 6326c25f37bbbd1a4efc2d866dddcecb516911eb
          git merge-base --is-ancestor origin/feat/silero-tts-native-import silero-candidate
          git push origin refs/heads/silero-candidate:refs/heads/git-bridge/candidate-silero-6a64a705
