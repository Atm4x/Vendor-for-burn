name: Git Bridge - publish native Silero V3 V5 candidate
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import exact native graph commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/silero-tts-native-import
          test "$(git rev-parse origin/main)" = f3618c635442334f02c47384c01dd13fed1891f7
          test "$(git rev-parse origin/feat/silero-tts-native-import)" = 0171c4082656af4b689ec7be5d03202afa7129f1
          base64 -d .git-bridge/silero-d2a37d0d.b64 > "$RUNNER_TEMP/silero.bundle"
          echo "4d82fa89c365ea02dc8b903c3ecf44bcb235c5238b7fe0484e428d3cd2393223  $RUNNER_TEMP/silero.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/silero.bundle"
          git fetch "$RUNNER_TEMP/silero.bundle" refs/heads/feat/silero-tts-native-import:refs/heads/silero-candidate
          test "$(git rev-parse silero-candidate)" = d2a37d0db8e297d61a7f0539e4a14ddfe1986ac4
          test "$(git rev-parse silero-candidate^{tree})" = 442b9e61474b362a892af315f6f3ed6dc446314d
          git merge-base --is-ancestor origin/feat/silero-tts-native-import silero-candidate
          git push origin refs/heads/silero-candidate:refs/heads/git-bridge/candidate-silero-d2a37d0d
