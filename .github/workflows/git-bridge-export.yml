name: Git Bridge - publish Silero English candidate
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import native Silero English commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/silero-tts-native-import
          test "$(git rev-parse origin/main)" = f3618c635442334f02c47384c01dd13fed1891f7
          test "$(git rev-parse origin/feat/silero-tts-native-import)" = 15b1a861be28cc4f9fed776cecd03058aab5fddc
          base64 -d .git-bridge/silero-fc82af0c.b64 > "$RUNNER_TEMP/silero.bundle"
          echo "1f48a193d99a227a1919cd053fbf3623dc5bf007ebe5714c3d49f06c74234c84  $RUNNER_TEMP/silero.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/silero.bundle"
          git fetch "$RUNNER_TEMP/silero.bundle" refs/heads/feat/silero-tts-native-import:refs/heads/silero-candidate
          test "$(git rev-parse silero-candidate)" = fc82af0c33b967472284e382bd28c2bccc32898f
          test "$(git rev-parse silero-candidate^{tree})" = 733da7e06463a416f577924dee3a6ed4b8dbc194
          git merge-base --is-ancestor origin/feat/silero-tts-native-import silero-candidate
          git push origin refs/heads/silero-candidate:refs/heads/git-bridge/candidate-silero-fc82af0c
