name: Git Bridge - publish native standalone Silero candidate
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import exact standalone graph commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/silero-tts-native-import
          test "$(git rev-parse origin/main)" = f3618c635442334f02c47384c01dd13fed1891f7
          test "$(git rev-parse origin/feat/silero-tts-native-import)" = a7bf8caa8dede56d3f10b47dece1dd80e4b08c84
          base64 -d .git-bridge/silero-8d8b54b5.b64 > "$RUNNER_TEMP/silero.bundle"
          echo "35e347ea477e09419daf8ee97f094dd9b605ad117b8657c2e90791b5b30e97ff  $RUNNER_TEMP/silero.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/silero.bundle"
          git fetch "$RUNNER_TEMP/silero.bundle" refs/heads/feat/silero-tts-native-import:refs/heads/silero-candidate
          test "$(git rev-parse silero-candidate)" = 8d8b54b5dbd56aacafe0f17e2b89268281eb8173
          test "$(git rev-parse silero-candidate^{tree})" = c327d7b7935e970c7287dc14ed008c04b1437ba8
          git merge-base --is-ancestor origin/feat/silero-tts-native-import silero-candidate
          git push origin refs/heads/silero-candidate:refs/heads/git-bridge/candidate-silero-8d8b54b5
