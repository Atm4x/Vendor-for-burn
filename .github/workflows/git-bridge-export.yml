name: Git Bridge - export current Silero
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/silero-tts-native-import
          fetch-depth: 0
      - name: Export exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6a64a705eaf739616b31dc88899ecb8e01ce5f25
          git update-ref refs/heads/feat/silero-tts-native-import 6a64a705eaf739616b31dc88899ecb8e01ce5f25
          git bundle create "$RUNNER_TEMP/repository.bundle" refs/heads/feat/silero-tts-native-import
          git bundle verify "$RUNNER_TEMP/repository.bundle"
          cd "$RUNNER_TEMP"
          sha256sum repository.bundle > repository.bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: silero-cycle5-source
          path: |
            ${{ runner.temp }}/repository.bundle
            ${{ runner.temp }}/repository.bundle.sha256
          compression-level: 0
          retention-days: 1
