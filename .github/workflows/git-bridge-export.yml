name: Git Bridge - publish native recurrent accent and V2 candidate
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import exact native quantized accent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/silero-tts-native-import
          test "$(git rev-parse origin/main)" = f3618c635442334f02c47384c01dd13fed1891f7
          test "$(git rev-parse origin/feat/silero-tts-native-import)" = 96a470e34e479dc383b6c1452d07b7063d1344af
          base64 -d .git-bridge/silero-a7bf8caa.b64 > "$RUNNER_TEMP/silero.bundle"
          echo "8d9339fffc805ef3fe7a8f02d797de84f08ea42257b79b71226981e77aca3a23  $RUNNER_TEMP/silero.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/silero.bundle"
          git fetch "$RUNNER_TEMP/silero.bundle" refs/heads/feat/silero-tts-native-import:refs/heads/silero-candidate
          test "$(git rev-parse silero-candidate)" = a7bf8caa8dede56d3f10b47dece1dd80e4b08c84
          test "$(git rev-parse silero-candidate^{tree})" = 00e194d086a8ae3892b2c489a4f452069ffb6832
          git merge-base --is-ancestor origin/feat/silero-tts-native-import silero-candidate
          git push origin refs/heads/silero-candidate:refs/heads/git-bridge/candidate-silero-a7bf8caa
