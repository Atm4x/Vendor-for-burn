name: Git Bridge - publish native Silero Tacotron2 candidate
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import exact native Tacotron2 commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/silero-tts-native-import
          test "$(git rev-parse origin/main)" = f3618c635442334f02c47384c01dd13fed1891f7
          test "$(git rev-parse origin/feat/silero-tts-native-import)" = d2a37d0db8e297d61a7f0539e4a14ddfe1986ac4
          base64 -d .git-bridge/silero-96a470e3.b64 > "$RUNNER_TEMP/silero.bundle"
          echo "351f1e1c02aa3c88e8557f1cc22e1fa54b322be6634707d1b1864ffef125f651  $RUNNER_TEMP/silero.bundle" | sha256sum -c -
          git bundle verify "$RUNNER_TEMP/silero.bundle"
          git fetch "$RUNNER_TEMP/silero.bundle" refs/heads/feat/silero-tts-native-import:refs/heads/silero-candidate
          test "$(git rev-parse silero-candidate)" = 96a470e34e479dc383b6c1452d07b7063d1344af
          test "$(git rev-parse silero-candidate^{tree})" = 030f736ca3b65fd08c2b7296b13f3b879ae646fa
          git merge-base --is-ancestor origin/feat/silero-tts-native-import silero-candidate
          git push origin refs/heads/silero-candidate:refs/heads/git-bridge/candidate-silero-96a470e3
