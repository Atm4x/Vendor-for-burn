name: Git Bridge - Silero official checkpoint
on:
  push:
    branches: [git-bridge/export-silero-ab4d79c7]
    paths: [.github/workflows/git-bridge-export.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify official v5_ru
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://models.silero.ai/models/tts/ru/v5_ru.pt -o "$RUNNER_TEMP/v5_ru.pt"
          cd "$RUNNER_TEMP"
          echo "7ba04d42340fe0398042eed2e0d12d62e23096d626b1b9feff4dcb1309197ab4  v5_ru.pt" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: silero-v5-ru-official
          path: ${{ runner.temp }}/v5_ru.pt
          retention-days: 1
          compression-level: 0
