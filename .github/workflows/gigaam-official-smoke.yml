name: GigaAM - Official checkpoint smoke
on:
  workflow_dispatch:
  push:
    branches: [git-bridge/gigaam-official-weights-20261127]
    paths: [.github/workflows/gigaam-official-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  flex-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8e1734bf16d75d83c1636f5d00cefd0f8485f49
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gigaam-v4_ctc-official
          path: ${{ runner.temp }}/gigaam-official/v4_ctc
          run-id: 46012580905
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: gigaam-multilingual_v2_rnnt-official
          path: ${{ runner.temp }}/gigaam-official/multilingual_v2_rnnt
          run-id: 46012580905
          github-token: ${{ github.token }}
      - name: Verify checkpoint integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/gigaam-official/v4_ctc"; sha256sum --check SHA256SUMS; echo '7f81bb7c82588bf3f6956e9ca6ce9451  v4_ctc.ckpt' | md5sum --check)
          (cd "$RUNNER_TEMP/gigaam-official/multilingual_v2_rnnt"; sha256sum --check SHA256SUMS; echo '4c24acddcf2f81d512563067b40ca36d  multilingual_v2_rnnt.ckpt' | md5sum --check)
      - name: Native Flex smoke on official weights
        shell: bash
        env:
          GIGAAM_OFFICIAL_DIR: ${{ runner.temp }}/gigaam-official
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          rustup toolchain install 1.100.0 --profile minimal
          cd models/gigaam
          cat > tests/official_runner_smoke.rs <<'RS'
          use anyhow::Result;
          use burn::tensor::Device;
          use gigaam_rs::{GigaAm, zapformer::language::LanguageTag};
          use std::path::PathBuf;
          fn check(name: &str, language: Option<LanguageTag>) -> Result<()> {
              let root = PathBuf::from(std::env::var("GIGAAM_OFFICIAL_DIR")?);
              let path = root.join(name).join(format!("{name}.ckpt"));
              eprintln!("CHECKPOINT_LOAD_START {name}");
              let model = GigaAm::load(&path, Device::flex())?;
              assert!(model.is_zapformer());
              eprintln!("CHECKPOINT_LOAD_PASS {name}");
              let pcm: Vec<f32> = (0..16000).map(|i| ((i as f32 * 0.067).sin()+(i as f32 * 0.101).cos())*0.1).collect();
              let result = model.transcribe_zapformer_heads_16k(&pcm, language.as_ref())?;
              eprintln!("OFFLINE_INFERENCE_PASS {name} {result:?}");
              for ms in [160,320,640] {
                  let mut stream = model.start_stream(Some(ms),language.as_ref(),true)?;
                  for packet in pcm.chunks(1280) { let _ = stream.push(packet,false)?; }
                  let _ = stream.flush()?;
                  assert!(stream.finished());
                  assert!(stream.encoded_frames()>0);
                  eprintln!("STREAM_INFERENCE_PASS {name} {ms}");
              }
              Ok(())
          }
          #[test]
          fn v4_ctc() -> Result<()> { check("v4_ctc",None) }
          #[test]
          fn multilingual_v2_rnnt() -> Result<()> { check("multilingual_v2_rnnt",Some(LanguageTag::Tag("ru".into()))) }
          RS
          cargo +1.100.0 test --locked --offline --release --no-default-features --features flex --test official_runner_smoke -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/gigaam-official-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gigaam-official-smoke-log
          path: ${{ runner.temp }}/gigaam-official-smoke.log
          if-no-files-found: warn
          retention-days: 3
