name: Export exact GigaAM Git bundle
on:
  push:
    branches:
      - codex/git-bridge-gigaam-export-20261117
    paths:
      - .github/workflows/git-bridge-gigaam-current-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch target and export full history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/codex/gigaam-v3-ctc-burn-20261117:refs/heads/gigaam-export'
          target="$(git rev-parse refs/heads/gigaam-export)"
          test "$target" = "9692cf5f52646290337268e929c76a56dae936b6"
          git bundle create "$RUNNER_TEMP/gigaam-current.bundle" refs/heads/gigaam-export
          git bundle verify "$RUNNER_TEMP/gigaam-current.bundle"
          (cd "$RUNNER_TEMP" && sha256sum gigaam-current.bundle > gigaam-current.bundle.sha256)
          printf '%s\n' "$target" > "$RUNNER_TEMP/source-head.txt"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: gigaam-current-exact-git-bundle
          path: |
            ${{ runner.temp }}/gigaam-current.bundle
            ${{ runner.temp }}/gigaam-current.bundle.sha256
            ${{ runner.temp }}/source-head.txt
          compression-level: 0
          retention-days: 3
