name: GigaAM Git Bridge Snapshot
on:
  push:
    branches: ["codex/gigaam-export-20261117d"]
    paths: [".github/workflows/gigaam-stage9-export.yml"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export Git history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/codex/gigaam-v3-ctc-burn-20261117:refs/heads/gigaam-base"
          git bundle create "$RUNNER_TEMP/gigaam.bundle" refs/heads/gigaam-base
          git bundle verify "$RUNNER_TEMP/gigaam.bundle"
          (cd "$RUNNER_TEMP" && sha256sum gigaam.bundle > gigaam.bundle.sha256)
          git rev-parse refs/heads/gigaam-base > "$RUNNER_TEMP/source-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: gigaam-stage9-full-bundle
          path: |
            ${{ runner.temp }}/gigaam.bundle
            ${{ runner.temp }}/gigaam.bundle.sha256
            ${{ runner.temp }}/source-head.txt
          retention-days: 1
          compression-level: 0
