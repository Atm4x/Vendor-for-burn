name: Build native workers for Windows x64

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'tools/restore_vendor_checksums.py'
      - 'tools/package_tts_windows.ps1'
      - 'tools/smoke_tts_worker.py'
      - '.github/workflows/build-native-workers-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_VERSION: '1.0.0'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: beat-this
            script: models/beat_this/package_windows.ps1
            compact: true
          - package: gigaam-v3
            script: models/gigaam/package_windows.ps1
            compact: false
          - package: rvc-v2
            script: models/tts-with-rvc-rs/build_windows.ps1
            compact: false
          - package: dettato
            script: models/dettato/package_windows.ps1
            compact: false
          - package: f5-tts
            script: tools/package_tts_windows.ps1
            family: f5-tts
            compact: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, smoke-test and stage the package
        shell: pwsh
        env:
          PACKAGE_SCRIPT: ${{ matrix.script }}
          PACKAGE_COMPACT: ${{ matrix.compact }}
          PACKAGE_FAMILY: ${{ matrix.family }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{
            Version = $env:WORKER_VERSION
            OutputRoot = (Join-Path $env:RUNNER_TEMP 'native-worker')
          }
          if ($env:PACKAGE_COMPACT -eq 'true') { $arguments.Compact = $true }
          if ($env:PACKAGE_FAMILY) { $arguments.Family = $env:PACKAGE_FAMILY }
          & $env:PACKAGE_SCRIPT @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}_v${{ env.WORKER_VERSION }}_win_x86_64
          path: ${{ runner.temp }}/native-worker/assets/${{ matrix.package }}_v${{ env.WORKER_VERSION }}_win_x86_64.zip
          if-no-files-found: error
          retention-days: 14
