name: Build native workers for Windows x64

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
  workflow_dispatch:
    inputs:
      worker:
        description: Windows package ID to build from main
        required: true
        type: string
      version:
        description: Optional package version override (X.Y.Z)
        required: false
        type: string

permissions:
  contents: read

env:
  WORKER_RELEASE_TAG: native-workers-v1.0.0

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            tools
            models
      - name: Select changed worker directories
        id: select
        shell: pwsh
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          REQUESTED_WORKER: ${{ inputs.worker }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $matrix = ./tools/select_windows_workers.ps1 -Before $env:PREVIOUS_SHA -Revision $env:GITHUB_SHA -Worker $env:REQUESTED_WORKER -Version $env:REQUESTED_VERSION
          $hasChanges = (ConvertFrom-Json -InputObject $matrix).include.Count -gt 0
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "has_changes=$($hasChanges.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host $matrix

  build:
    needs: select
    if: needs.select.outputs.has_changes == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and stage ${{ matrix.id }}
        shell: pwsh
        env:
          PACKAGE_SCRIPT: ${{ matrix.script }}
          PACKAGE_COMPACT: ${{ matrix.compact }}
          PACKAGE_FAMILY: ${{ matrix.family }}
          PACKAGE_VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @{
            Version = $env:PACKAGE_VERSION
            OutputRoot = (Join-Path $env:RUNNER_TEMP 'native-worker')
          }
          if ($env:PACKAGE_COMPACT -eq 'true') { $arguments.Compact = $true }
          if ($env:PACKAGE_FAMILY) { $arguments.Family = $env:PACKAGE_FAMILY }
          & $env:PACKAGE_SCRIPT @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: windows-worker-${{ matrix.id }}
          path: ${{ runner.temp }}/native-worker/assets/${{ matrix.id }}_v${{ matrix.version }}_win_x86_64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ !cancelled() && needs.select.outputs.has_changes == 'true' }}
    needs: [select, build]
    concurrency:
      group: native-worker-releases
      queue: max
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-worker-*
          path: ${{ runner.temp }}/native-worker-inputs
      - name: Prepare the update against the current release index
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $inputRoot = Join-Path $env:RUNNER_TEMP 'native-worker-inputs'
          if (!(Test-Path -LiteralPath $inputRoot) -or !(Get-ChildItem -LiteralPath $inputRoot -Filter '*.zip' -File -Recurse)) {
            Write-Host 'No successful worker builds to publish'
            exit 0
          }
          $prior = Join-Path $env:RUNNER_TEMP 'native-worker-prior'
          New-Item -ItemType Directory -Path $prior | Out-Null
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:WORKER_RELEASE_TAG" --jq '.assets' |
            Set-Content -LiteralPath (Join-Path $prior 'assets.json') -Encoding utf8NoBOM
          gh release download $env:WORKER_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'staged-release-index.json' --dir $prior
          $staged = Join-Path $env:RUNNER_TEMP 'native-worker-release'
          ./tools/stage_native_workers_release.ps1 -Revision $env:GITHUB_SHA -Matrix $env:PACKAGE_MATRIX -InputRoot $inputRoot -OutputRoot $staged -ExistingIndex (Join-Path $prior 'staged-release-index.json') -ExistingAssets (Join-Path $prior 'assets.json')
          if (Test-Path -LiteralPath (Join-Path $staged 'publication.json')) {
            "updated=true" >> $env:GITHUB_OUTPUT
          }
      - name: Sign provenance of the updated index
        if: steps.stage.outputs.updated == 'true'
        uses: actions/attest@v4
        with:
          subject-path: '${{ runner.temp }}/native-worker-release/staged-release-index.json'
          create-storage-record: false
      - name: Update the existing Windows release
        if: steps.stage.outputs.updated == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/publish_native_workers_release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:WORKER_RELEASE_TAG -Staged (Join-Path $env:RUNNER_TEMP 'native-worker-release') -ExistingIndex (Join-Path $env:RUNNER_TEMP 'native-worker-prior/staged-release-index.json')
