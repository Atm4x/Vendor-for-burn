name: RVC NSF CUDA scheduling A/B package

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
    paths:
      - '.github/workflows/rvc-nsf-cuda-scheduling.yml'
      - 'research/stage37-windows-gpu-bench/windows/Run-NSF-Scheduling.ps1'
      - 'models/tts-with-rvc-rs/src/bin/profile_nsf_stage42.rs'

permissions:
  contents: read

jobs:
  build-win-nsf:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: nsf-cuda-windows-${{ hashFiles('Cargo.lock') }}
      - name: Restore exact vendored source checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendor check failed' }
      - name: Compile NSF CUDA scheduling profiler
        shell: pwsh
        run: |
          cargo build --locked --offline --release -p tts-with-rvc-rs --no-default-features --features cuda --bin profile_nsf_stage42
          if ($LASTEXITCODE -ne 0) { throw 'CUDA NSF profiler build failed' }
          New-Item -ItemType Directory -Force -Path dist/nsf-cuda | Out-Null
          Copy-Item target/release/profile_nsf_stage42.exe dist/nsf-cuda/profile_nsf_stage42.exe
          Copy-Item models/tts-with-rvc-rs/tests/fixtures/synthetic_nsf_decoder.pth dist/nsf-cuda/synthetic_nsf_decoder.pth
          Copy-Item research/stage37-windows-gpu-bench/windows/Run-NSF-Scheduling.ps1 dist/nsf-cuda/Run-NSF-Scheduling.ps1
          @'
          Stage 44 NSF CUDA scheduling experiment
          Run:
            powershell -ExecutionPolicy Bypass -File .\Run-NSF-Scheduling.ps1 -Iterations 12 -Warmup 4 -Frames 64,256,1024
          Compares default, first-branch aggregation, flush-per-branch, flush-per-stage,
          sync-per-branch, flush-per-pair, flush-per-conv, and sync-per-pair.
          Includes full FP32 output parity comparison within each run.
          Uses a public synthetic NSF decoder checkpoint, not CrazyMita weights.
          Important: CPU flush blocks on task completion, CUDA flush only submits commands.
          Upload nsf_cuda_scheduling.json and nsf_cuda_scheduling.stderr.log for interpretation.
          '@ | Set-Content dist/nsf-cuda/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-nsf-cuda-scheduling-windows-x64
          path: dist/nsf-cuda/
          if-no-files-found: warn
          retention-days: 14
