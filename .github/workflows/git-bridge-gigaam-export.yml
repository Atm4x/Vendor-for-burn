name: Export Git Bundle For GigaAM
on:
  push:
    branches: ['codex/gigaam-v3-ctc-burn-20261117']
    paths: ['.github/workflows/git-bridge-gigaam-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 'refs/heads/experiment/conv-kernel-rnd-stage33-20261110:refs/heads/export-source'
          git bundle create "$RUNNER_TEMP/repository.bundle" refs/heads/export-source
          git bundle verify "$RUNNER_TEMP/repository.bundle"
          (cd "$RUNNER_TEMP" && sha256sum repository.bundle > repository.bundle.sha256)
          git rev-parse refs/heads/export-source > "$RUNNER_TEMP/source-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: gigaam-source-git-bundle
          path: |
            ${{ runner.temp }}/repository.bundle
            ${{ runner.temp }}/repository.bundle.sha256
            ${{ runner.temp }}/source-head.txt
          retention-days: 2
          compression-level: 0
