name: F5 TTS CONT20 Cargo Offline Vendor
on:
  push:
    branches:
      - codex/f5-tts-rust-cont20
    paths:
      - .github/workflows/f5-tts-cont20-vendor.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Export all locked F5 TTS dependencies
        run: |
          set -euo pipefail
          rm -f .cargo/config.toml models/f5_tts/.cargo/config.toml
          cargo vendor --manifest-path models/f5_tts/Cargo.toml --versioned-dirs /tmp/f5-vendor > /tmp/vendor-config.txt
          tar -C /tmp -I 'zstd -3 -T0' -cf /tmp/f5-cont20-cargo-vendor.tar.zst f5-vendor
          sha256sum /tmp/f5-cont20-cargo-vendor.tar.zst >/tmp/f5-cont20-cargo-vendor.sha256
          git rev-parse HEAD > /tmp/f5-vendor-source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f5-cont20-cargo-vendor
          path: |
            /tmp/f5-cont20-cargo-vendor.tar.zst
            /tmp/f5-cont20-cargo-vendor.sha256
            /tmp/f5-vendor-source-head.txt
          retention-days: 3
          compression-level: 0
