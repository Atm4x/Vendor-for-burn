name: F5 TTS CONT20 Import Local BigVGAN Patch
on:
  push:
    branches:
      - codex/f5-tts-rust-cont20
    paths:
      - .github/workflows/f5-tts-cont20-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply verified source patch and commit
        env:
          PATCH_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | xz -d > /tmp/f5-cont20.patch
          printf '%s  %s\n' a50c2a8c739ec6f668edde4af6c0ddfe598055f1aaa83abc57d04944466f8a70 /tmp/f5-cont20.patch | sha256sum -c -
          git apply --check /tmp/f5-cont20.patch
          git apply /tmp/f5-cont20.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/f5_tts
          git commit -m 'feat(f5-tts): implement BigVGAN-v2 native Rust vocoder and Slaney mel'
          git push origin HEAD:codex/f5-tts-rust-cont20
