name: RVC Stage64 single full-WAV diagnostic Windows package
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
      - ci/stage64-diagnostic-artifact-retry-20261112
    paths:
      - 'models/tts-with-rvc-rs/src/diagnostic.rs'
      - 'models/tts-with-rvc-rs/src/rvc_inference.rs'
      - 'models/tts-with-rvc-rs/src/hubert_model.rs'
      - 'models/tts-with-rvc-rs/src/rmvpe_mel.rs'
      - 'models/tts-with-rvc-rs/src/decoder.rs'
      - 'models/tts-with-rvc-rs/src/main.rs'
      - 'research/stage37-windows-gpu-bench/windows/Run-RVC-Full-Diagnostic-Stage64.ps1'
      - '.github/workflows/rvc-stage64-full-diagnostic.yml'
permissions:
  contents: read
jobs:
  stage64-single-cuda-diagnostic-package:
    runs-on: windows-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: stage64-unified-${{ hashFiles('Cargo.lock') }}
      - name: Restore vendored checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendored checksum restore failed' }
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $script = 'research/stage37-windows-gpu-bench/windows/Run-RVC-Full-Diagnostic-Stage64.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Host; throw 'Invalid Stage64 PowerShell syntax' }
      - name: Compile one unified CPU CUDA WGPU EXE
        shell: pwsh
        run: |
          cargo build --release --locked --offline -p tts-with-rvc-rs --no-default-features --features 'cpu,cuda,wgpu' --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'Unified native build failed' }
      - name: Verify executable metadata only
        shell: pwsh
        run: |
          & target/release/tts-with-rvc-rs.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed' }
      - name: Package diagnostic runner without private models
        shell: pwsh
        run: |
          $folder = 'dist/stage64-full-diagnostic'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item target/release/tts-with-rvc-rs.exe $folder
          Copy-Item research/stage37-windows-gpu-bench/windows/Run-RVC-Full-Diagnostic-Stage64.ps1 $folder
          @'
          Stage 64: exactly one measured full-WAV CUDA baseline with CPU FAISS/F0.
          One representative-shape warmup batch is excluded from measurement.
          Diagnostic device synchronization distorts timing; use stage shares to identify bottlenecks.
          GPU telemetry is sampled by nvidia-smi; no Nsight kernel profiling is included.
          Copy private weights, FAISS index and the entire input WAV to .\embed\.
          No private assets are bundled; no real GPU inference is executed in GitHub CI.
          '@ | Set-Content "$folder/README.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-stage64-single-full-diagnostic-windows-x64
          path: dist/stage64-full-diagnostic/
          retention-days: 14
          if-no-files-found: error
