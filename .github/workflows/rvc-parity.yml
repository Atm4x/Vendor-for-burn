name: RVC Rust Burn parity

on:
  push:
    branches: [main]
    paths:
      - 'models/tts-with-rvc-rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/restore_vendor_checksums.py'
      - '.github/workflows/rvc-parity.yml'
  pull_request:
    paths:
      - 'models/tts-with-rvc-rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/restore_vendor_checksums.py'
      - '.github/workflows/rvc-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Restore exact upstream vendor bytes before offline build
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate \
            --output "$RUNNER_TEMP/zerocopy-0.8.63.crate"
          python3 tools/restore_vendor_checksums.py --zerocopy-archive "$RUNNER_TEMP/zerocopy-0.8.63.crate"
      - name: Run Burn parity with vendored dependencies
        run: |
          cargo test -p tts-with-rvc-rs --locked --offline
          cargo run -p tts-with-rvc-rs --locked --offline -- verify-text-front models/tts-with-rvc-rs/tests/fixtures/text_front.json flex
          cargo run -p tts-with-rvc-rs --locked --offline -- verify-attention models/tts-with-rvc-rs/tests/fixtures/relative_attention.json flex
          cargo run -p tts-with-rvc-rs --locked --offline -- verify-encoder-layer models/tts-with-rvc-rs/tests/fixtures/encoder_layer.json flex
          cargo run -p tts-with-rvc-rs --locked --offline -- verify-text-encoder models/tts-with-rvc-rs/tests/fixtures/text_encoder.json flex
      - name: Package native Linux parity runner
        shell: bash
        run: |
          strip target/debug/tts-with-rvc-rs
      - uses: actions/upload-artifact@v4
        with:
          name: rvc-burn-parity-linux
          path: target/debug/tts-with-rvc-rs
          if-no-files-found: error
          retention-days: 3
