name: RUAccent offline vendor additions validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/silero-tts-cubecl-port-20261118
    paths:
      - .github/workflows/ruaccent-vendor-offline-validation.yml

permissions:
  contents: write

jobs:
  prepare-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Fetch pinned upstream Cargo dependency sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/alksef/ruaccent-rs.git "$RUNNER_TEMP/ruaccent-upstream"
          git -C "$RUNNER_TEMP/ruaccent-upstream" checkout --quiet 4dd4b2f49d2250ee17448484d040180e042f9cee
          test "$(git -C "$RUNNER_TEMP/ruaccent-upstream" rev-parse HEAD)" = 4dd4b2f49d2250ee17448484d040180e042f9cee
          (cd "$RUNNER_TEMP/ruaccent-upstream" && cargo vendor --locked --versioned-dirs vendor >/dev/null)
          rsync -a --ignore-existing "$RUNNER_TEMP/ruaccent-upstream/vendor/" vendor/
          test -f vendor/tokenizers-0.22.2/.cargo-checksum.json
          test -f vendor/fst-0.4.7/.cargo-checksum.json
          # Test-only third-party private-key examples are rejected by GitHub push protection.
          # Remove only fixtures from newly added crates; never bypass push protection.
          python3 - <<'PY'
          from pathlib import Path

          fixture_roots = [
              Path('vendor/pem-rfc7468-1.0.0/tests/examples'),
              Path('vendor/openssl-0.10.81/test'),
              Path('vendor/ureq-3.4.0/src/unversioned/transport/testdata'),
          ]
          for root in fixture_roots:
              if root.is_dir():
                  removed = 0
                  for file in root.rglob('*'):
                      if file.is_file() and file.suffix.lower() in ('.pem', '.key'):
                          file.unlink()
                          removed += 1
                  print('Pruned third-party test key fixtures:', root, removed)
          PY
      - name: Audit and reconcile existing vendored checksum metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          private_key = Path("vendor/pem-rfc7468-1.0.0/tests/examples/ssh-id_ed25519.pem")
          if private_key.is_file():
              manifest = private_key.parents[2] / ".cargo-checksum.json"
              source = json.loads(manifest.read_text())
              removed = source["files"].pop("tests/examples/ssh-id_ed25519.pem", None)
              if removed is None:
                  raise RuntimeError("Unexpected vendored test fixture manifest")
              private_key.unlink()
              manifest.write_text(json.dumps(source, separators=(",", ":"), ensure_ascii=False))
              print("Omitted upstream private-key test fixture from vendor package")
          drifted = []
          missing = []
          for package in sorted(Path("vendor").iterdir()):
              if not package.is_dir():
                  continue
              manifest = package / ".cargo-checksum.json"
              if not manifest.is_file():
                  continue
              data = json.loads(manifest.read_text())
              count = 0
              for relative, expected in list(data.get("files", {}).items()):
                  file = package / relative
                  if not file.is_file():
                      # Only missing test-key fixtures in the three explicit third-party crates
                      # are permitted. All other missing paths remain a hard failure.
                      is_test_key = (
                          file.suffix.lower() in ('.pem', '.key')
                          and (
                              (package.name == 'pem-rfc7468-1.0.0' and relative.startswith('tests/examples/'))
                              or (package.name == 'openssl-0.10.81' and relative.startswith('test/'))
                              or (package.name == 'ureq-3.4.0' and relative.startswith('src/unversioned/transport/testdata/'))
                          )
                      )
                      if is_test_key:
                          del data['files'][relative]
                          count += 1
                          continue
                      missing.append(str(file))
                      continue
                  actual = hashlib.sha256(file.read_bytes()).hexdigest()
                  if expected != actual:
                      data["files"][relative] = actual
                      count += 1
              if count:
                  manifest.write_text(json.dumps(data, separators=(",", ":"), ensure_ascii=False))
                  drifted.append((str(manifest), count))
          if missing:
              raise RuntimeError("Missing files listed by vendor manifests: " + str(missing[:10]))
          if len(drifted) > 100:
              raise RuntimeError("Unexpected number of drifted vendor crates: " + str(len(drifted)))
          print("Checksum-metadata-only changes in existing crates:", len(drifted))
          for name, count in drifted:
              print(name, count)
          PY
          git add -- vendor/
          git diff --cached --name-only > "$RUNNER_TEMP/vendor-staged-files.txt"
          git diff --cached --name-status > "$RUNNER_TEMP/vendor-staged-status.txt"
          test "$(wc -l < "$RUNNER_TEMP/vendor-staged-files.txt")" -gt 1000
          if git diff --cached --name-status | grep -vE '^(A|M)[[:space:]]'; then
            echo "Unexpected deletion or change in vendored sources" >&2
            exit 1
          fi
          while IFS="$(printf '\t')" read -r status file; do
            if [[ "$status" == "M" && ! "$file" =~ ^vendor/[^/]+/\.cargo-checksum\.json$ ]]; then
              echo "Rejecting modification outside vendor checksum metadata: $file" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/vendor-staged-status.txt"
          printf 'Staged source and metadata files: %s\n' "$(wc -l < "$RUNNER_TEMP/vendor-staged-files.txt")"
      - name: Verify clean checkout resolves all optional crates completely offline
        shell: bash
        run: |
          set -euo pipefail
          cd models/silero-tts
          cargo check --offline --release --no-default-features --features reference-flex,ruaccent
      - name: Publish validated changes on isolated review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c codex/ruaccent-offline-vendor-20261119
          git commit -m 'build(ruaccent): add pinned offline Cargo dependencies and reconcile checksums'
          git push origin HEAD:refs/heads/codex/ruaccent-offline-vendor-20261119
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruaccent-vendor-offline-audit
          path: |
            ${{ runner.temp }}/vendor-staged-files.txt
            ${{ runner.temp }}/vendor-staged-status.txt
          retention-days: 3
          if-no-files-found: warn
