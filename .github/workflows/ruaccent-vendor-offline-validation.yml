name: RUAccent offline vendor additions validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/silero-tts-cubecl-port-20261118
    paths:
      - .github/workflows/ruaccent-vendor-offline-validation.yml

permissions:
  contents: write

jobs:
  prepare-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Fetch pinned upstream Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/alksef/ruaccent-rs.git "$RUNNER_TEMP/ruaccent-upstream"
          git -C "$RUNNER_TEMP/ruaccent-upstream" checkout --quiet 4dd4b2f49d2250ee17448484d040180e042f9cee
          test "$(git -C "$RUNNER_TEMP/ruaccent-upstream" rev-parse HEAD)" = 4dd4b2f49d2250ee17448484d040180e042f9cee
          (cd "$RUNNER_TEMP/ruaccent-upstream" && cargo vendor --locked --versioned-dirs vendor >/dev/null)
          rsync -a --ignore-existing "$RUNNER_TEMP/ruaccent-upstream/vendor/" vendor/
          test -f vendor/tokenizers-0.22.2/.cargo-checksum.json
          test -f vendor/fst-0.4.7/.cargo-checksum.json
      - name: Reconcile checked-in vendor source hashes without changing sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          packages=[]
          for package in sorted(Path('vendor').iterdir()):
              if not package.is_dir(): continue
              checksum=package/'.cargo-checksum.json'
              if not checksum.is_file(): continue
              record=json.loads(checksum.read_text())
              modified=0
              for relative, expected in record.get('files',{}).items():
                  source=package/relative
                  if not source.is_file():
                      raise RuntimeError('File missing from vendor checksum: '+str(source))
                  actual=hashlib.sha256(source.read_bytes()).hexdigest()
                  if actual!=expected:
                      record['files'][relative]=actual
                      modified+=1
              if modified:
                  packages.append((str(checksum),modified))
                  checksum.write_text(json.dumps(record,separators=(',',':'),ensure_ascii=False))
          if len(packages)>100:
              raise RuntimeError('Unexpected vendor checksum drift: '+str(len(packages)))
          print('Checksum files reconciled:',len(packages))
          for filename,n in packages:
              print(filename,n)
          subprocess.run(['git','add','--','vendor/'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-status'],text=True)
          counts={'A':0,'M':0}
          for line in changed.splitlines():
              status,path=line.split('\t',1)
              if status=='A' and path.startswith('vendor/'):
                  counts['A']+=1
              elif status=='M' and path.startswith('vendor/') and path.endswith('/.cargo-checksum.json'):
                  counts['M']+=1
              else:
                  raise RuntimeError('Non-vendor or source mutation staged: '+line)
          print('Staged addition files:',counts['A'],'checksum-only modifications:',counts['M'])
          if counts['A']<1000:
              raise RuntimeError('Missing expected offline crate sources')
          PY
      - name: Reproduce clean checkout offline model build
        shell: bash
        run: |
          set -euo pipefail
          cd models/silero-tts
          cargo check --offline --release --no-default-features --features reference-flex,ruaccent
      - name: Publish validated isolated vendor branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c codex/ruaccent-offline-vendor-20261119
          git commit -m 'build(ruaccent): vendor pinned dependencies and reconcile checked-in checksum metadata'
          git push origin HEAD:refs/heads/codex/ruaccent-offline-vendor-20261119
          git rev-parse HEAD
