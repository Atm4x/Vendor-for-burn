name: One-shot GigaAM CONT5 source bridge
on:
  push:
    branches:
      - codex/gigaam-worker-lifecycle-cont5-20261118
    paths:
      - .github/workflows/gigaam-cont5-source-bridge.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact local source patch and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4e2dbe4278a12c18a9dba6da2015b08d73c34a6e"
          cat > "$RUNNER_TEMP/source.b64" <<'B64'
          
          B64
          base64 -d "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.diff.xz"
          echo "cb42d883798e10a0dc57264f4b83d34071567340264b16c24fe958cdf84c8014  $RUNNER_TEMP/source.diff.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/source.diff.xz" > "$RUNNER_TEMP/source.diff"
          git apply --check "$RUNNER_TEMP/source.diff"
          git apply "$RUNNER_TEMP/source.diff"
          rm .github/workflows/gigaam-cont5-source-bridge.yml
          git add -A
          test "$(git write-tree)" = "c9bdf15b4f113d6a5d043328982847a7192c0d82"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(gigaam): add explicit single-model inference worker lifecycle"
          git push origin HEAD:refs/heads/codex/gigaam-worker-lifecycle-cont5-20261118
