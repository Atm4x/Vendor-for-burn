name: RVC NSF Stage52 dynamic CUDA Graph proof package

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
    paths:
      - '.github/workflows/rvc-nsf-cuda-dynamic-stage52.yml'
      - 'models/tts-with-rvc-rs/Cargo.toml'
      - 'models/tts-with-rvc-rs/src/bin/profile_nsf_graph_stage52.rs'
      - 'research/stage37-windows-gpu-bench/windows/Run-NSF-Dynamic-Graph.ps1'

permissions:
  contents: read

jobs:
  windows-cuda-dynamic:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: rvc-nsf-stage52-cuda-${{ hashFiles('Cargo.lock') }}
      - name: Restore vendored checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendor checksum verification failed' }
      - name: Compile synthetic dynamic-graph experiment
        shell: pwsh
        run: |
          cargo build --locked --offline --release -p tts-with-rvc-rs --no-default-features --features cuda --bin profile_nsf_graph_stage52
          if ($LASTEXITCODE -ne 0) { throw 'Stage52 compilation failed' }
          New-Item -ItemType Directory -Force -Path dist/nsf-stage52 | Out-Null
          Copy-Item target/release/profile_nsf_graph_stage52.exe dist/nsf-stage52/
          Copy-Item models/tts-with-rvc-rs/tests/fixtures/synthetic_nsf_decoder.pth dist/nsf-stage52/
          Copy-Item research/stage37-windows-gpu-bench/windows/Run-NSF-Dynamic-Graph.ps1 dist/nsf-stage52/
          @'
          Stage52: dynamic input, harmonic source and conditioning using stable CubeCL buffers.
          Run on your NVIDIA GPU:
            powershell -ExecutionPolicy Bypass -File .\Run-NSF-Dynamic-Graph.ps1 -Iterations 16 -Frames "64,256,1024"
          A successful result proves same-allocation input refresh and hardware CUDA Graph FP32 parity
          for the synthetic NSF workload. It is NOT an end-to-end RVC voice quality/performance test.
          Output: NSF_CUDA_DYNAMIC_GRAPH_STAGE52_RESULTS.zip
          '@ | Set-Content dist/nsf-stage52/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-nsf-stage52-dynamic-cuda-graph-windows-x64
          path: dist/nsf-stage52/
          if-no-files-found: warn
          retention-days: 14
