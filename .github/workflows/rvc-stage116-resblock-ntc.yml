name: RVC Stage116 ResBlock NTC Windows profile package

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
    paths:
      - models/tts-with-rvc-rs/src/decoder.rs
      - models/tts-with-rvc-rs/src/cubecl_conv.rs
      - vendor/burn-cubecl-0.22.1/src/kernel/conv/preact_residual1d.rs
      - vendor/cubek-convolution-0.3.1/src/kernels/forward/direct_preact_residual.rs
      - research/stage116-resblock-ntc/**
      - .github/workflows/rvc-stage116-resblock-ntc.yml

permissions:
  contents: read

concurrency:
  group: rvc-stage116-resblock-ntc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage116-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: stage116-rust100-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            stage114-windows-rust100-
      - name: Check PowerShell runner and reference invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'research/stage116-resblock-ntc/windows/Run-Stage116-ResBlock.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw 'Stage116 PowerShell syntax failure' }
          rustc --edition=2024 --test research/stage116-resblock-ntc/ntc_reference.rs -O -o "$env:RUNNER_TEMP/stage116_reference.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Stage116 reference compile failed' }
          & "$env:RUNNER_TEMP/stage116_reference.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Stage116 reference parity failed' }
      - name: Restore vendored checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendored crate validation failed' }
      - name: Compile Rust CUDA / WGPU / CPU CLI
        shell: pwsh
        run: |
          cargo build --release --offline --locked -p tts-with-rvc-rs --no-default-features --features 'cpu,cuda,wgpu' --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'Stage116 Rust CLI build failed' }
          & target/release/tts-with-rvc-rs.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Stage116 doctor failed' }
      - name: Prepare Windows profiler package
        if: always()
        shell: pwsh
        run: |
          $dest = 'dist/rvc-stage116-resblock-ntc'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item research/stage116-resblock-ntc/windows/*.ps1 $dest
          $exe = 'target/release/tts-with-rvc-rs.exe'
          $built = Test-Path $exe
          if ($built) { Copy-Item $exe $dest }
          Set-Content -Path (Join-Path $dest 'BUILD_STATUS.txt') -Value "Stage116 Rust build=$built`nSHA=$env:GITHUB_SHA`nNo NVIDIA GPU on CI; run NCU/NSYS locally." -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-stage116-resblock-ntc-windows-x64
          path: dist/rvc-stage116-resblock-ntc/
          if-no-files-found: error
          retention-days: 14
