name: GigaAM CONT4 source bridge import
on:
  push:
    branches:
      - codex/gigaam-source-parity-cont4-20261118
    paths:
      - .github/git-bridge/gigaam-cont4-payload.b64
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gigaam-cont4-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify payload and apply exact source delta
        shell: bash
        run: |
          set -euo pipefail
          payload=".github/git-bridge/gigaam-cont4-payload.b64"
          base64 --decode "$payload" > "$RUNNER_TEMP/gigaam-cont4.patch.xz"
          echo "cd700c92d959ecff28beadee0601eb532a7f24e59eb9c36f602c283d8cb27531  $RUNNER_TEMP/gigaam-cont4.patch.xz" | sha256sum --check
          xz --decompress --stdout "$RUNNER_TEMP/gigaam-cont4.patch.xz" > "$RUNNER_TEMP/gigaam-cont4.patch"
          git apply --binary --check "$RUNNER_TEMP/gigaam-cont4.patch"
          git apply --binary --index "$RUNNER_TEMP/gigaam-cont4.patch"
          git rm -- "$payload"
          git diff --cached --check
          git -c user.name="gigaam-source-bridge[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "feat(gigaam): publish CONT1-CONT4 Python-source functional parity"
          git push origin "HEAD:refs/heads/codex/gigaam-source-parity-cont4-20261118"
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)"
