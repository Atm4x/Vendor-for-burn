name: RVC Stage93 global compute-cost chunk planning Windows gate
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/conv-kernel-rnd-stage33-20261110
    paths:
      - 'models/tts-with-rvc-rs/src/chunk_plan.rs'
      - 'models/tts-with-rvc-rs/src/chunked.rs'
      - 'research/stage93-cost-aware/**'
      - 'research/STAGE93_COST_AWARE_GLOBAL_CHUNK_RND_2026-11-14.md'
      - 'research/stage37-windows-gpu-bench/windows/Run-RVC-Full-Stage93.ps1'
      - '.github/workflows/rvc-stage93-global-compute-plan.yml'
permissions:
  contents: read
jobs:
  cost-aware-windows:
    runs-on: windows-latest
    timeout-minutes: 115
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/tracel
          key: stage93-cost-aware-${{ hashFiles('Cargo.lock') }}
      - name: Restore vendored checksums
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zerocopy-0.8.63.crate'
          Invoke-WebRequest -Uri 'https://static.crates.io/crates/zerocopy/zerocopy-0.8.63.crate' -OutFile $archive
          python tools/restore_vendor_checksums.py --zerocopy-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Vendored checksum restore failed' }
      - name: Check Stage93 PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = 'research/stage37-windows-gpu-bench/windows/Run-RVC-Full-Stage93.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw 'Invalid Stage93 runner' }
      - name: Verify cost-aware global plan and chunking regressions
        shell: pwsh
        run: |
          rustc --edition=2024 --test research/stage90-global-chunks/chunk_test_harness.rs -o stage93_chunk_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Stage93 test compilation failed' }
          & ./stage93_chunk_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Stage93 tests failed' }
      - name: Build unified CPU CUDA WGPU Windows executable
        shell: pwsh
        run: |
          cargo check --offline --locked -p tts-with-rvc-rs --no-default-features --features 'cpu,cuda,wgpu' --lib --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'Stage93 check failed' }
          cargo build --release --offline --locked -p tts-with-rvc-rs --no-default-features --features 'cpu,cuda,wgpu' --bin tts-with-rvc-rs
          if ($LASTEXITCODE -ne 0) { throw 'Stage93 release build failed' }
          & target/release/tts-with-rvc-rs.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'Stage93 doctor failed' }
      - name: Package Stage93 cost-aware global chunk plan A/B comparison
        shell: pwsh
        run: |
          $folder = 'dist/stage93-cost-aware'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item target/release/tts-with-rvc-rs.exe $folder
          Copy-Item research/stage37-windows-gpu-bench/windows/Run-RVC-Full-Stage93.ps1 $folder
          @'
          Stage93: cost-aware global RVC chunk planning, with explicit attention/conv/launch/boundary proxy.
          Put private .pth/.pt/.index/.wav under .\embed\.
          Run Run-RVC-Full-Stage93.ps1 using the same Voice, Hubert, Rmvpe, Index and InputWav arguments.
          A/B/B/A: quiet-splice(900,+1) vs cost-aware(900,max), global F0, phase and noise enabled in both.
          -LaunchCost/-LinearCost/-AttentionMilli/-SpliceCost change the analytical cost profile.
          These coefficients are NOT RTX latency predictions. Both strategies may produce different WAVs.
          Windows CI has no CUDA GPU, and cannot establish speed or audio quality.
          '@ | Set-Content (Join-Path $folder 'README.txt')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rvc-stage93-cost-aware-windows-x64
          path: dist/stage93-cost-aware/
          retention-days: 14
          if-no-files-found: warn
