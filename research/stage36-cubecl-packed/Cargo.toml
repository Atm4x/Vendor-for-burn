[package]
name = "cubecl-cpu-stage35-bench"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
cubecl = { version = "=0.11.3", default-features = false, features = ["stdlib"] }
cubecl-cpu = { version = "=0.11.3", default-features = false, features = ["std"] }
cubecl-server = { version = "=0.11.3", default-features = false, features = ["std"] }
cubek-convolution = { path = "../../vendor/cubek-convolution-0.3.1", default-features = false, features = ["std"] }
bytemuck = "=1.25.2"
burn-flex = { version = "=0.22.1", default-features = false, features = ["std", "simd", "rayon"] }
burn-backend = { version = "=0.22.1", default-features = false, features = ["std"] }
