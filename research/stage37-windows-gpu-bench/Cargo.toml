[package]
name = "rvc-cubecl-gpu-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace]

[features]
default = ["wgpu"]
wgpu = ["dep:cubecl-wgpu"]
cuda = ["dep:cubecl-cuda"]
cpu = ["dep:cubecl-cpu"]

[dependencies]
cubecl = { version = "=0.11.3", default-features = false, features = ["stdlib"] }
cubecl-server = { version = "=0.11.3", default-features = false, features = ["std"] }
cubek-convolution = { path = "../../vendor/cubek-convolution-0.3.1", default-features = false, features = ["std"] }
cubecl-wgpu = { version = "=0.11.3", default-features = false, features = ["std"], optional = true }
cubecl-cuda = { version = "=0.11.3", default-features = false, features = ["std"], optional = true }
cubecl-cpu = { version = "=0.11.3", default-features = false, features = ["std"], optional = true }
bytemuck = "=1.25.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "=2.6.1"

[[bin]]
name = "bench_pipeline_stage41"
path = "src/bin/bench_pipeline_stage41.rs"
required-features = ["cpu"]

[[bin]]
name = "bench_conv_stride_stage46"
path = "src/bin/bench_conv_stride_stage46.rs"
required-features = ["cpu"]

[[bin]]
name = "bench_conv_pipeline_stage47"
path = "src/bin/bench_conv_pipeline_stage47.rs"
required-features = ["cpu"]
